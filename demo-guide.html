<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UTG Labs — Contact Intel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      overflow-y: auto;
      font-size: 13px;
    }

    .header {
      padding: 12px 14px;
      border-bottom: 1px solid #1a1a1a;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      background: #fff;
      color: #000;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .header-title { font-size: 12px; font-weight: 600; color: #666; }

    /* Empty state */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 48px);
      gap: 10px;
      color: #333;
      text-align: center;
      padding: 24px;
    }
    .empty-icon { font-size: 32px; }
    .empty p { font-size: 13px; color: #444; line-height: 1.6; }

    /* Contact card */
    .contact-card {
      display: none;
      flex-direction: column;
      gap: 0;
    }
    .contact-card.visible { display: flex; }

    /* Avatar row */
    .avatar-row {
      padding: 16px 14px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #111;
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #1f1f1f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .avatar-info { flex: 1; min-width: 0; }
    .contact-name { font-size: 14px; font-weight: 700; color: #f5f5f5; }
    .contact-biz { font-size: 12px; color: #666; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Score badge */
    .score-row {
      padding: 10px 14px;
      border-bottom: 1px solid #111;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .score-label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.08em; }
    .score-badge {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .score-bar-track {
      width: 80px;
      height: 4px;
      background: #1f1f1f;
      border-radius: 2px;
      overflow: hidden;
    }
    .score-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.5s ease;
    }
    .score-num { font-size: 12px; font-weight: 700; }
    .score-hot { color: #ff3b30; }
    .score-warm { color: #ff9500; }
    .score-cool { color: #34c759; }

    /* Section */
    .section {
      border-bottom: 1px solid #111;
    }
    .section-title {
      padding: 10px 14px 6px;
      font-size: 10px;
      font-weight: 700;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* Info rows */
    .info-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 6px 14px;
    }
    .info-icon { font-size: 12px; color: #444; width: 14px; flex-shrink: 0; margin-top: 1px; }
    .info-content { flex: 1; min-width: 0; }
    .info-label { font-size: 10px; color: #444; margin-bottom: 1px; }
    .info-value { font-size: 12px; color: #ccc; line-height: 1.4; }

    /* Tags */
    .tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px 14px 12px;
    }
    .tag {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid #222;
      color: #888;
    }
    .tag.hot { border-color: #ff3b3033; color: #ff3b30; background: #ff3b3011; }
    .tag.orange { border-color: #ff950033; color: #ff9500; background: #ff950011; }
    .tag.green { border-color: #34c75933; color: #34c759; background: #34c75911; }
    .tag.blue { border-color: #007aff33; color: #007aff; background: #007aff11; }

    /* AI summary */
    .ai-box {
      margin: 10px 14px 12px;
      background: #111;
      border: 1px solid #1f1f1f;
      border-radius: 10px;
      padding: 12px;
    }
    .ai-box-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .ai-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #007aff;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .ai-label { font-size: 10px; font-weight: 700; color: #007aff; text-transform: uppercase; letter-spacing: 0.08em; }
    .ai-text { font-size: 12px; color: #888; line-height: 1.65; }

    /* History */
    .history-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 7px 14px;
    }
    .history-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #2a2a2a;
      flex-shrink: 0;
      margin-top: 4px;
    }
    .history-dot.active { background: #007aff; }
    .history-text { font-size: 12px; color: #555; line-height: 1.4; }
    .history-text strong { color: #888; font-weight: 600; }
    .history-time { font-size: 10px; color: #333; margin-top: 2px; }

    /* CTA */
    .cta-row {
      padding: 12px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .cta-btn {
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }
    .cta-primary { background: #fff; color: #000; }
    .cta-secondary { background: #1a1a1a; color: #888; border: 1px solid #222; }
    .cta-btn:hover { opacity: 0.85; }

    .powered {
      text-align: center;
      padding: 10px;
      font-size: 10px;
      color: #2a2a2a;
      border-top: 1px solid #111;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <span class="badge">AI</span>
      <span class="header-title">Contact Intel</span>
    </div>
  </div>

  <!-- Empty state -->
  <div class="empty" id="emptyState">

    <p>Open a conversation to see contact intelligence and lead scoring.</p>
  </div>

  <!-- Contact card -->
  <div class="contact-card" id="contactCard">

    <!-- Avatar -->
    <div class="avatar-row">

    <!-- Lead score -->
    <div class="score-row">

      <div class="score-badge">
        <div class="score-bar-track">
          <div class="score-bar-fill" id="scoreBar"></div>
        </div>
        <span class="score-num" id="scoreNum"></span>
      </div>
    </div>

    <!-- Contact info -->
    <div class="section">
      <div class="section-title">Contact</div>
      <div class="info-row">
        <div class="info-icon">📧</div>
        <div class="info-content">
          <div class="info-label">Email</div>
          <div class="info-value" id="contactEmail"></div>
        </div>
      </div>
      <div class="info-row">
        <div class="info-icon">📱</div>
        <div class="info-content">
          <div class="info-label">Phone</div>
          <div class="info-value" id="contactPhone"></div>
        </div>
      </div>
      <div class="info-row">
        <div class="info-icon">📍</div>
        <div class="info-content">
          <div class="info-label">Location</div>
          <div class="info-value" id="contactLocation"></div>
        </div>
      </div>
      <div class="info-row" style="padding-bottom:12px">
        <div class="info-icon">📲</div>
        <div class="info-content">
          <div class="info-label">Channel</div>
          <div class="info-value" id="contactChannel"></div>
        </div>
      </div>
    </div>

    <!-- Business info -->
    <div class="section">
      <div class="section-title">Business</div>
      <div class="info-row">
        <div class="info-icon">🏢</div>
        <div class="info-content">
          <div class="info-label">Industry</div>
          <div class="info-value" id="bizIndustry"></div>
        </div>
      </div>
      <div class="info-row">
        <div class="info-icon">👥</div>
        <div class="info-content">
          <div class="info-label">Business size</div>
          <div class="info-value" id="bizSize"></div>
        </div>
      </div>
      <div class="info-row">
        <div class="info-icon">📈</div>
        <div class="info-content">
          <div class="info-label">Est. monthly revenue</div>
          <div class="info-value" id="bizRevenue"></div>
        </div>
      </div>
      <div class="info-row" style="padding-bottom:12px">
        <div class="info-icon">📣</div>
        <div class="info-content">
          <div class="info-label">Social presence</div>
          <div class="info-value" id="bizSocial"></div>
        </div>
      </div>
    </div>

    <!-- Tags -->
    <div class="section">
      <div class="section-title">Tags</div>
      <div class="tags-row" id="contactTags"></div>
    </div>

    <!-- AI Summary -->
    <div class="section" style="padding-bottom:4px">
      <div class="section-title">AI Summary</div>
      <div class="ai-box">
        <div class="ai-box-header">
          <div class="ai-dot"></div>
          <span class="ai-label">UTG Labs AI</span>
        </div>
        <div class="ai-text" id="aiSummary"></div>
      </div>
    </div>

    <!-- Conversation history -->
    <div class="section">
      <div class="section-title">History</div>
      <div id="historyItems" style="padding-bottom:8px"></div>
    </div>

    <!-- CTA -->
    <div class="cta-row">
      <button class="cta-btn cta-primary" id="ctaMain"></button>
      <button class="cta-btn cta-secondary">Add note</button>
    </div>

    <div class="powered">Powered by UTG Labs</div>
  </div>

  <script>

          { text: "No previous conversations", time: "First contact", active: false },
        ],

      },
      "Priya Mehta": {
        biz: "Lumen Skincare",
        email: "priya@lumenskincare.com",
        phone: "+1 (214) 555-0103",
        location: "Plano, TX",
        channel: "Instagram DM",
        industry: "Beauty & Skincare",
        size: "E-commerce, 2–4 staff",

        ai: "Priya is a returning customer checking on a restock — she's been waiting 2 weeks which shows strong brand loyalty. This is an easy conversion: confirm the restock, offer to reserve her unit, and upsell a complementary product while you have her attention.",

          { text: "Previous purchase: Hyaluronic serum bundle", time: "3 weeks ago", active: false },
          { text: "First purchase via Instagram DM", time: "2 months ago", active: false },

      },
      "Derek Williams": {
        biz: "DW Real Estate Group",
        email: "derek@dwrealestate.com",
        phone: "+1 (214) 555-0104",
        location: "McKinney, TX",
        channel: "Email",
        industry: "Real Estate",
        size: "Independent agent",
        revenue: "$20,000 – $50,000/mo",
        social: "LinkedIn: 1,200 connections · Active on Zillow",
        score: 78,
        tags: [
          { label: "new-from-ad", type: "blue" },
          { label: "hot-lead", type: "hot" },
          { label: "showing-request", type: "orange" },
        ],
        ai: "Derek came in from an ad and is asking about a specific property with a showing request this weekend — high intent buyer. Respond immediately with available times. Buyers who request showings within 24 hours of first contact have a 3x higher close rate.",

        industry: "Fashion & Retail",
        size: "Small boutique, 2–3 staff",
        revenue: "$12,000 – $25,000/mo",
        social: "IG: 8,900 followers · High engagement · Runs ads",
        score: 72,
        tags: [
          { label: "new-from-ad", type: "blue" },
          { label: "product-inquiry", type: "orange" },
        ],
        ai: "Ashley saw the red wrap dress on Instagram and is looking for a specific size — she's already sold on the product. This is a low-friction conversion: confirm stock, offer shipping or in-store pickup, and mention any current promotions to push her to purchase now.",
        history: [
          { text: "Asking about red wrap dress in size medium", time: "Just now", active: true },
          { text: "No previous conversations", time: "First contact", active: false },
        ],

      },
      "Carlos Rivera": {
        biz: "Riviera Events & Venue",

      "Tanya Brown": {

        ],

        history: [
          { text: "Asking about family membership for 4 people", time: "Just now", active: true },
          { text: "No previous conversations", time: "First contact", active: false },
        ],
        cta: "Send family membership offer",
      },
      "Kevin Nguyen": {

        email: "kevin@nguyendentistry.com",
        phone: "+1 (214) 555-0108",
        location: "Mesquite, TX",
        channel: "WhatsApp",
        industry: "Healthcare & Dental",
        size: "Private practice, 5–10 staff",
        revenue: "$35,000 – $65,000/mo",
        social: "Google: 4.9★ (142 reviews) · Zocdoc listed",
        score: 88,
        tags: [
          { label: "urgent", type: "hot" },
          { label: "emergency", type: "hot" },
          { label: "new-patient", type: "blue" },
        ],
        ai: "Kevin has a dental emergency — tooth pain since last night. This is urgent and time-sensitive. Emergency dental patients who get a fast response become long-term patients 70% of the time. Confirm an appointment time immediately and send the office address. Do not delay this reply.",
        history: [
          { text: "Reporting tooth pain — requesting emergency appointment", time: "Just now", active: true },
          { text: "No previous conversations", time: "New patient", active: false },
        ],
        cta: "Book emergency appointment",
      },
    };

    function getScoreColor(score) {
      if (score >= 85) return '#ff3b30';
      if (score >= 70) return '#ff9500';
      return '#34c759';
    }

    function getScoreClass(score) {
      if (score >= 85) return 'score-hot';
      if (score >= 70) return 'score-warm';
      return 'score-cool';
    }

    function getInitials(name) {
      return name.split(' ').map(n => n[0]).join('').toUpperCase();
    }

    function renderContact(name) {
      const c = contacts[name];
      if (!c) return;

      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('contactCard').classList.add('visible');

      document.getElementById('contactAvatar').textContent = getInitials(name);
      document.getElementById('contactName').textContent = name;
      document.getElementById('contactBiz').textContent = c.biz;
      document.getElementById('contactEmail').textContent = c.email;
      document.getElementById('contactPhone').textContent = c.phone;
      document.getElementById('contactLocation').textContent = c.location;
      document.getElementById('contactChannel').textContent = c.channel;
      document.getElementById('bizIndustry').textContent = c.industry;
      document.getElementById('bizSize').textContent = c.size;
      document.getElementById('bizRevenue').textContent = c.revenue;
      document.getElementById('bizSocial').textContent = c.social;
      document.getElementById('aiSummary').textContent = c.ai;
      document.getElementById('ctaMain').textContent = c.cta;

      const color = getScoreColor(c.score);
      document.getElementById('scoreBar').style.width = c.score + '%';
      document.getElementById('scoreBar').style.background = color;
      document.getElementById('scoreNum').textContent = c.score + '/100';
      document.getElementById('scoreNum').className = 'score-num ' + getScoreClass(c.score);

      const tagsEl = document.getElementById('contactTags');
      tagsEl.innerHTML = c.tags.map(t =>
        `<span class="tag ${t.type}">${t.label}</span>`
      ).join('');

      const historyEl = document.getElementById('historyItems');
      historyEl.innerHTML = c.history.map(h =>
        `<div class="history-item">
          <div class="history-dot ${h.active ? 'active' : ''}"></div>
          <div>
            <div class="history-text"><strong>${h.text}</strong></div>
            <div class="history-time">${h.time}</div>
          </div>
        </div>`
      ).join('');
    }

    // Listen for Chatwoot postMessage events
    window.addEventListener('message', function(e) {
      if (e.data && e.data.event === 'appContext') {
        const name = e.data?.data?.conversation?.meta?.sender?.name;
        if (name && contacts[name]) {
          renderContact(name);
        }
      }
    });

    // Signal to Chatwoot that the app is ready — triggers it to resend appContext
    window.addEventListener('load', function() {
      window.parent.postMessage('chatwoot-dashboard-app:ready', '*');
    });

    // For testing outside Chatwoot — show first contact
    const params = new URLSearchParams(window.location.search);
    const testName = params.get('contact');
    if (testName && contacts[testName]) {
      renderContact(testName);
    }
  </script>

</body>
</html>
