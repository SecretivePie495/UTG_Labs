<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UTG Labs Demo Guide</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      padding: 14px 16px;
      border-bottom: 1px solid #1f1f1f;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      background: #fff;
      color: #000;
      padding: 3px 7px;
      border-radius: 4px;
    }
    .header-title {
      font-size: 12px;
      font-weight: 600;
      color: #888;
    }

    /* Video section */
    .video-wrap {
      width: 100%;
      background: #111;
      border-bottom: 1px solid #1f1f1f;
      flex-shrink: 0;
      position: relative;
    }
    .video-wrap iframe {
      width: 100%;
      height: 180px;
      display: block;
    }
    .video-placeholder {
      height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .play-circle {
      width: 44px;
      height: 44px;
      background: #1f1f1f;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #666;
    }
    .video-placeholder p { font-size: 13px; color: #666; }
    .video-placeholder span { font-size: 11px; color: #333; }

    /* Progress */
    .progress-track {
      height: 2px;
      background: #1a1a1a;
      flex-shrink: 0;
    }
    .progress-bar {
      height: 100%;
      background: #fff;
      transition: width 0.35s ease;
    }

    /* Steps content */
    .steps-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px 0;
    }
    .step-label {
      font-size: 10px;
      color: #444;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .step-title {
      font-size: 15px;
      font-weight: 700;
      color: #f5f5f5;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .step-body {
      font-size: 13px;
      color: #888;
      line-height: 1.65;
    }

    /* Dots */
    .dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      padding: 14px 0 10px;
      flex-shrink: 0;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #2a2a2a;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: background 0.2s;
    }
    .dot.active { background: #fff; }

    /* Nav */
    .nav {
      display: flex;
      gap: 8px;
      padding: 10px 16px 16px;
      flex-shrink: 0;
    }
    .btn-back {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #666;
      padding: 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-back:disabled { opacity: 0.25; cursor: default; }
    .btn-back:not(:disabled):hover { background: #222; color: #fff; }
    .btn-next {
      flex: 2;
      background: #fff;
      border: none;
      color: #000;
      padding: 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-next:hover { opacity: 0.88; }

    /* Divider */
    .divider {
      height: 1px;
      background: #1a1a1a;
      margin: 0 16px;
      flex-shrink: 0;
    }

    /* All steps list (collapsed) */
    .all-steps {
      flex-shrink: 0;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .mini-step {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .mini-step:hover { background: #141414; }
    .mini-step.active { background: #141414; }
    .mini-step-num {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #1f1f1f;
      font-size: 10px;
      font-weight: 700;
      color: #555;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .mini-step.active .mini-step-num,
    .mini-step.done .mini-step-num {
      background: #fff;
      color: #000;
    }
    .mini-step-label {
      font-size: 12px;
      color: #555;
      transition: color 0.15s;
    }
    .mini-step.active .mini-step-label { color: #f5f5f5; }
    .mini-step.done .mini-step-label { color: #666; text-decoration: line-through; }
  </style>
</head>
<body>

  <div class="header">
    <span class="badge">LIVE DEMO</span>
    <span class="header-title">UTG Labs Walkthrough</span>
  </div>

  <div class="video-wrap">
    <!-- Replace the placeholder div below with your Loom iframe when ready:
    <iframe src="https://www.loom.com/embed/YOUR_VIDEO_ID" frameborder="0" allowfullscreen></iframe>
    -->
    <div class="video-placeholder">
      <div class="play-circle">▶</div>
      <p>Video walkthrough</p>
      <span>Add your Loom URL to activate</span>
    </div>
  </div>

  <div class="progress-track">
    <div class="progress-bar" id="progressBar" style="width: 20%"></div>
  </div>

  <div class="steps-wrap">
    <div class="step-label" id="stepLabel">Step 1 of 5</div>
    <div class="step-title" id="stepTitle"></div>
    <div class="step-body" id="stepBody"></div>
  </div>

  <div class="dots" id="dots"></div>

  <div class="nav">
    <button class="btn-back" id="btnBack" onclick="prev()">← Back</button>
    <button class="btn-next" id="btnNext" onclick="next()">Next →</button>
  </div>

  <div class="divider"></div>

  <div class="all-steps" id="allSteps"></div>

  <script>
    const steps = [
      {
        title: 'Your inboxes on the left',
        body: 'The left sidebar shows all your channels — Instagram, WhatsApp, Facebook, and Email — in one place. Click any inbox to see its conversations.',
      },
      {
        title: 'Open a conversation',
        body: 'Click any conversation from the list. Each one is a real customer message from a different channel and business type.',
      },
      {
        title: 'The AI draft is waiting',
        body: 'See the blue private note at the bottom of the conversation? That\'s the AI reply — already written before anyone touched it. You review it, edit if needed, then send.',
      },
      {
        title: 'Labels tell you what\'s hot',
        body: 'Look for the labels on each conversation — hot-lead, urgent, catering, new-from-ad. Leads from ads get tagged automatically so the most important ones rise to the top.',
      },
      {
        title: 'Send a reply',
        body: 'Type in the reply box at the bottom and hit send. Or copy the AI draft, edit it to match your voice, and send it as your own. The customer never sees the private draft note.',
      },
    ];

    let current = 0;

    function render() {
      const step = steps[current];
      document.getElementById('stepLabel').textContent = `Step ${current + 1} of ${steps.length}`;
      document.getElementById('stepTitle').textContent = step.title;
      document.getElementById('stepBody').textContent = step.body;
      document.getElementById('progressBar').style.width = `${((current + 1) / steps.length) * 100}%`;

      // Back button
      document.getElementById('btnBack').disabled = current === 0;

      // Next button
      const btnNext = document.getElementById('btnNext');
      if (current === steps.length - 1) {
        btnNext.textContent = 'Got it ✓';
        btnNext.onclick = finish;
      } else {
        btnNext.textContent = 'Next →';
        btnNext.onclick = next;
      }

      // Dots
      const dotsEl = document.getElementById('dots');
      dotsEl.innerHTML = steps.map((_, i) =>
        `<button class="dot ${i === current ? 'active' : ''}" onclick="goTo(${i})"></button>`
      ).join('');

      // Mini steps list
      const allStepsEl = document.getElementById('allSteps');
      allStepsEl.innerHTML = steps.map((s, i) =>
        `<div class="mini-step ${i === current ? 'active' : i < current ? 'done' : ''}" onclick="goTo(${i})">
          <div class="mini-step-num">${i < current ? '✓' : i + 1}</div>
          <div class="mini-step-label">${s.title}</div>
        </div>`
      ).join('');
    }

    function next() {
      if (current < steps.length - 1) { current++; render(); }
    }

    function prev() {
      if (current > 0) { current--; render(); }
    }

    function goTo(i) {
      current = i;
      render();
    }

    function finish() {
      document.getElementById('stepTitle').textContent = 'You\'re all set!';
      document.getElementById('stepBody').textContent = 'You\'ve seen what UTG Labs can do. Ready to set this up for your business?';
      document.getElementById('btnNext').textContent = 'Apply for a spot →';
      document.getElementById('btnNext').onclick = () => window.open('https://utglabs.com/apply', '_blank');
      document.getElementById('btnBack').style.display = 'none';
    }

    render();
  </script>

</body>
</html>
