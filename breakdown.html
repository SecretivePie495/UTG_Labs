<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free System Breakdown</title>
  
  <link rel="icon" type="image/jpg" href="/images/Favicon.jpg">
  <meta name="description" content="We 3x'd our growth when we turned paid ads on. Learn from us.">
  
  <meta property="og:image" content="https://storage.googleapis.com/facelessbroll_website/UdoPIC.jpg">
  <meta property="og:title" content="Free Agency Ads Checklist">
  <meta property="og:description" content="We 3x'd our growth when we turned paid ads on. Learn from us.">
  <meta property="og:type" content="website">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      background-color: #ffffff;
      color: #000000;
      font-family: 'Roboto', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="antialiased">
  
  <main class="flex min-h-screen flex-col">
    <div class="flex-1">
      <div class="relative z-10">
        
        <!-- Header Section -->
        <div class="w-full bg-transparent">
          <div class="w-full max-w-md sm:max-w-xl mx-auto md:max-w-screen-md lg:max-w-screen-lg xl:max-w-screen-xl 2xl:max-w-screen-2xl">
            <div class="grid grid-cols-1 gap-4 px-4 lg:px-12">
              
              <!-- Main Card -->
              <div class="relative w-full bg-white rounded-2xl h-full">
                <div class="w-full max-w-md sm:max-w-xl mx-auto md:max-w-3xl lg:max-w-4xl h-full">
                  <div class="flex h-full flex-col p-4 sm:p-10 lg:px-0">
                    
                    <!-- Profile Avatars -->
                    <div class="relative w-full bg-transparent pb-2">
                      <div class="w-full max-w-md sm:max-w-xl mx-auto md:max-w-3xl lg:max-w-4xl">
                        <div class="flex items-center justify-center flex-col">
                          <div class="flex flex-shrink-0 items-center justify-center -space-x-3 mb-2">
                            <div class="relative overflow-hidden rounded-full border-2 border-white w-10 h-10">
                              <img src="https://storage.googleapis.com/facelessbroll_website/UdoPIC.jpg" alt="Udo Onyekwere" class="absolute inset-0 w-full h-full object-cover">
                            </div>
                            <div class="relative overflow-hidden rounded-full border-2 border-white w-10 h-10">
                              <img src="https://storage.googleapis.com/media.utg-media.com/UTGlogo.png" alt="UTG Labs" class="absolute inset-0 w-full h-full object-cover">
                            </div>
                          </div>
                          
                          <!-- Name & Company -->
                          <div class="space-y-2">
                            <div class="text-sm text-center text-black">
                              <p><strong>Udo Onyekwere, CEO</strong></p>
                              <p><strong>UTG Labs</strong></p>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                    
                    <!-- Subheadline -->
                    <div class="relative w-full bg-transparent pt-2 pb-4">
                      <div class="w-full max-w-md sm:max-w-xl mx-auto md:max-w-3xl lg:max-w-4xl">
                        <div class="text-center text-black">
                          <p class="text-lg md:text-xl leading-snug">
                            <u><em>Reviving Dead Leads for Service Businesses Selling $1k–$10k Jobs 👇 👇 </em></u>
                          </p>
                          <p class="text-3xl sm:text-4xl md:text-5xl font-bold leading-tight tracking-tight mt-4">
                            We Bring Your Old Leads Back to Life and Book You Customers in 7 Days
                          </p>
                        </div>
                      </div>
                    </div>
                    
                    <!-- Video -->
                    <div class="relative w-full bg-transparent py-6">
                      <div class="w-full max-w-md sm:max-w-xl mx-auto md:max-w-3xl lg:max-w-4xl">
                        <div class="overflow-hidden rounded-2xl">
                          <video 
                            src="https://storage.googleapis.com/media.utg-media.com/ClientDemo.mp4" 
                            poster="https://storage.googleapis.com/media.utg-media.com/UTG_Labs.jpg" 
                            controls 
                            playsinline 
                            preload="metadata"
                            class="w-full aspect-video bg-black object-contain"
                          ></video>
                        </div>
                      </div>
                    </div>
                    

                  </div>
                </div>
              </div>
              
            </div>
          </div>
        </div>
        
      </div>
    </div>
  </main>

</body>
</html>
