# The site has no build step, so Netlify publishes the repo root as-is — which
# otherwise serves netlify/functions/*.js as readable static files alongside
# running them as functions. The handler sends leads directly via Resend (no
# n8n webhook anymore), and the API key lives only in Netlify's env, so nothing
# secret is published. Functions stay reachable at /.netlify/functions/<name>.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

# quiz.utglabs.com serves the quiz, not the homepage. The subdomain is a fresh,
# uncached host for Instagram, so its root lands directly on the quiz page with
# the correct Open Graph tags (updating utglabs.com/quiz* URLs won't refresh an
# already-cached Instagram DM preview, but a new host has no cache to serve).
[[redirects]]
  from = "/"
  to = "/quiz.html"
  status = 200
  force = true
  conditions = { Host = ["quiz.utglabs.com"] }

[[redirects]]
  from = "/*"
  to = "/quiz.html"
  status = 200
  force = true
  conditions = { Host = ["quiz.utglabs.com"] }
