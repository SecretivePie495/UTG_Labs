# The site has no build step, so Netlify publishes the repo root as-is — which
# otherwise serves netlify/functions/*.js as readable static files alongside
# running them as functions. The handler sends leads directly via Resend (no
# n8n webhook anymore), and the API key lives only in Netlify's env, so nothing
# secret is published. Functions stay reachable at /.netlify/functions/<name>.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

# quiz.utglabs.com serves the quiz, not the homepage. Netlify's redirect
# conditions do NOT support Host (only Role/Language/Country), so the correct
# way to scope a redirect to a specific domain is to use the full URL in the
# `from` field. A fresh, uncached host gives Instagram a guaranteed-new preview.
[[redirects]]
  from = "https://quiz.utglabs.com/*"
  to = "/quiz.html"
  status = 200
  force = true

[[redirects]]
  from = "https://quiz.utglabs.com"
  to = "/quiz.html"
  status = 200
  force = true
